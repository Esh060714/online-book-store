<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Bookstore Dashboard</title>
<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
}

.centered {
      text-align: center;
      background-color: #fff;
      max-width: 500px;
      margin: auto;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0px 2px 10px rgba(0,0,0,0.1);
  
}
.in{
    background-color: #fff;
      max-width: 450px;
      margin: 10px;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0px 2px 10px rgba(0,0,0,0.1);
    
}
.but{
   width: auto;
      background-color: #28a745;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    
}

.hidden {
  display: none;
}

nav {
  background: #333;
  color: white;
  padding: 10px;
}

nav h2 {
  display: inline-block;
}

nav button {
  float: right;
  margin-left: 10px;
}

nav ul {
  margin-top: 10px;
  list-style: none;
  padding: 0;
}

nav ul li {
  display: inline-block;
  margin-right: 20px;
  cursor: pointer;
}

.tab {
  padding: 20px;
}

.book-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 10px;
}

.book-grid div {
  border: 1px solid #ccc;
  padding: 10px;
}

/* Dark Mode */
body.dark {
  background: #121212;
  color: white;
}
body.dark nav {
  background: #222;
}
body.dark input, body.dark button {
  background: #333;
  color: white;
}


  
</style>
</head>
<body>
  <div id="login-page" class="centered">
    <h1>Admin Login</h1><br>
    <input type="text" id="admin-username" placeholder="Username" class="in"><br>
    <input type="password" id="admin-password" placeholder="Password" class="in"><br><br>
    <button class="but" onclick="login()">Login</button>
  </div>

  <div id="dashboard" class="hidden">
    <nav>
      <h2>Admin Dashboard</h2>
      <button onclick="logout()">Logout</button>
      <button onclick="toggleDarkMode()">Dark Mode</button>
      <ul>
        <li onclick="showTab('books')">Books</li>
        <li onclick="showTab('members')">Members</li>
        <li onclick="showTab('orders')">Orders</li>
        <li onclick="showTab('settings')">Settings</li>
        <button onclick="window.location.href='indexpage.html' ">Home</button>
      </ul>
    </nav>

    <section id="content">
      <div id="books" class="tab">
        <h2>Books Management</h2>
        <input type="text" id="book-title" placeholder="Book Title">
        <input type="text" id="book-author" placeholder="Author">
        <input type="number" id="book-price" placeholder="Price">
        <input type="text" id="book-image" placeholder="Image URL">
        <input type="file" id="file"placeholder="upload file">
        <button onclick="addBook()">Add Book</button>
        <div id="book-list" class="book-grid"></div>
      </div>

      <div id="members" class="tab hidden">
        <h2>Members List</h2>
        <table id="members-table"></table>
      </div>

      <div id="orders" class="tab hidden">
        <h2>Orders List</h2>
        <table id="orders-table"></table>
      </div>

      <div id="settings" class="tab hidden">
        <h2>Settings</h2>
        <input type="password" id="new-password" placeholder="New Password">
        <button onclick="changePassword()">Change Password</button>
      </div>
    </section>
  </div>
<section id="loadBooks" class="book-grid"></section>
  <script src="script.js"></script>
  
</body>
</html>
