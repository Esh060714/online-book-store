<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feedback or Article requests</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f2f5;
      padding: 20px;
    }
    .feedback-container {
      background-color: #fff;
      max-width: 500px;
      margin: auto;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0px 2px 10px rgba(0,0,0,0.1);
      
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }
    input, textarea {
      width: 100%;
      padding: 12px;
      margin: 8px 0 16px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      resize: none;
      font-size: 16px;
    }
    button {
      width: 100%;
      background-color: #28a745;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #218838;
    }
    .message {
      margin-top: 20px;
      text-align: center;
      font-size: 18px;
      color: green;
      display: none;
    }
  </style>
</head>
<body>

<div class="feedback-container">
  <h2>Give Us Your Feedback<br> or<br> you Want To Get</h2>
  <form id="feedbackForm">
    <input type="text" id="name" placeholder="Your Name" required>
    <input type="email" id="email" placeholder="Your Email" required>
    <textarea id="feedback" rows="5" placeholder="Write here..." required></textarea>
    <button type="submit" onclick="window.location.href='indexpage.html' ">Submit Feedback </button><br><br>
    <button onclick="window.location.href='indexpage.html' ">back to home</button>
  </form>
  <div class="message" id="message">Thank you for your feedback!</div>
</div>

<script>
  const form = document.getElementById('feedbackForm');
  const message = document.getElementById('message');

  form.addEventListener('submit', function(event) {
    event.preventDefault(); // Prevent page refresh

    // Get the values
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const feedback = document.getElementById('feedback').value.trim();

    if (name && email && feedback) {
      console.log("Feedback submitted:");
      console.log("Name:", name);
      console.log("Email:", email);
      console.log("Feedback:", feedback);

      // Show a success message
      message.style.display = 'block';

      // Optionally, clear the form
      form.reset();
    } else {
      alert('Please fill all the fields!');
    }
  });
</script>

</body>
</html>
